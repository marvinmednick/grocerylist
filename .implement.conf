# Default implementation tool and model.
# Override with --tool/--model args or IMPLEMENT_TOOL/IMPLEMENT_MODEL env vars.
# Precedence: --tool arg > IMPLEMENT_TOOL env > this file

tool=codex
model=gpt-5.4

# Test command — run from the project root
TEST_CMD=npm --prefix client test -- --watchAll=false

# Path to the known-failures baseline file
KNOWN_FILE=client/known-test-failures.txt

# File path pattern used by the aider tool to extract files from specs
SPEC_FILE_PATTERN=client|supabase/migrations

# Representative test file loaded as read-only context for aider sessions
AIDER_REFERENCE_FILE=client/components/__tests__/SmartAddItem-test.tsx
